# qm-agentd example configuration
#
# Copy to config.yaml and uncomment/adjust the identity block you need:
#   cp config.example.yaml config.yaml
#
# Credential HTTP API (see agent.openapi.json and GET /openapi.json when running):
#   GET /
#   GET /openapi.json
#   GET /docs
#   GET /manifest.json
#   GET /billets/{name}/token
#   GET /billets/{name}/key.pem   (csr.enabled)
#   GET /billets/{name}/cert.pem  (csr.enabled)
#   POST /subscriptions           {"billets": ["a", "b"]}
#   GET /subscriptions/{id}/token (combined exchange when all billets are available)

quartermaster:
  url: https://quartermaster.example.com:8443
  mtls:
    # Optional. ca_file verifies Quartermaster's server cert.
    # cert_file/key_file are only needed when NOT using SPIRE mtls mode
    # (AWS/GCP/SPIRE jwt send identity via subject_token instead).
    ca_file: /etc/qm-agent/ca.pem
    # cert_file: /etc/qm-agent/client.pem
    # key_file: /etc/qm-agent/client-key.pem

identity:
  # ---------------------------------------------------------------------------
  # Option A — SPIRE (recommended on Kubernetes / VMs with SPIRE agent)
  # ---------------------------------------------------------------------------
  type: spire
  spire:
    # mtls: identity from X.509 SVID (no subject_token sent)
    # jwt:  JWT SVID sent as subject_token (client mTLS to QM is optional)
    mode: mtls
    socket_path: unix:///tmp/spire-agent/public/api.sock
    jwt_audience: quartermaster.example.com

  # ---------------------------------------------------------------------------
  # Option B — AWS (EC2/ECS/EKS with instance/task role credentials)
  # ---------------------------------------------------------------------------
  # type: aws
  # aws:
  #   region: us-east-1
  #   subject_token_type: urn:quartermaster:token-type:aws-presigned-sts

  # ---------------------------------------------------------------------------
  # Option C — GCP (GCE / GKE with metadata server)
  # ---------------------------------------------------------------------------
  # type: gcp
  # gcp:
  #   audience: quartermaster.example.com
  #   metadata_host: metadata.google.internal
  #   subject_token_type: urn:quartermaster:token-type:gcp-identity

exchange:
  grant_type: urn:ietf:params:oauth:grant-type:token-exchange

  # Empty list → POST /billets/me for discovery.
  # Non-empty → skip discovery; use this fixed billet list.
  billets: []

  # When true (default), exchange one token per entitled billet on each refresh.
  # Set false to only discover billets until workloads POST /subscriptions.
  # auto_per_billet: true

  # Default JWT audience for token exchange. Subscriptions may override via POST body.
  audience: http://localhost:8443
  subject_token_type: ""

refresh:
  # Re-exchange this long before the earliest billet token expires.
  margin: 5m

csr:
  # When true, generate a per-billet EC key, submit a CSR during exchange,
  # and serve the issued chain at /billets/{name}/cert.pem.
  enabled: false

server:
  listen: 127.0.0.1:8765
